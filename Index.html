<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поздравление папе ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    font-family: 'Segoe UI', 'Georgia', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #4a1e4d, #2c1810);
    background-size: 400% 400%;
    animation: bgMove 18s ease infinite;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes bgMove {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Плавающие сердечки на фоне */
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .heart {
    position: absolute;
    bottom: -60px;
    font-size: 22px;
    opacity: 0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 6px rgba(255, 120, 150, 0.7));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.55; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
  }

  /* Canvas для конфетти */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* Карточка */
  .card {
    position: relative;
    z-index: 2;
    max-width: 620px;
    width: 100%;
    padding: 52px 40px 44px;
    border-radius: 26px;
    text-align: center;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    animation: cardIn 1s cubic-bezier(.2, .9, .3, 1.3) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-top {
    font-size: 60px;
    line-height: 1;
    display: block;
    margin-bottom: 18px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1) rotate(-4deg); }
    50%      { transform: scale(1.12) rotate(4deg); }
  }

  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    background: linear-gradient(90deg, #ffd86f, #fc6262, #ff9a76, #ffd86f);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine {
    to { background-position: 300% center; }
  }

  p.text {
    font-size: clamp(17px, 3.4vw, 21px);
    line-height: 1.75;
    color: #f2eef7;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    margin-bottom: 12px;
  }

  .divider {
    width: 90px;
    height: 3px;
    margin: 26px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, #ffd86f, transparent);
  }

  .signature {
    font-style: italic;
    color: #c9bfd8;
    font-size: 15px;
    letter-spacing: 0.4px;
  }

  button {
    margin-top: 30px;
    padding: 15px 38px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    color: #2a1a10;
    cursor: pointer;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ffd86f, #fc9d62);
    box-shadow: 0 10px 26px rgba(252, 157, 98, 0.42);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  button:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 16px 34px rgba(252, 157, 98, 0.6);
  }
  button:active {
    transform: translateY(0) scale(0.97);
  }

  @media (max-width: 480px) {
    .card { padding: 40px 22px 34px; border-radius: 20px; }
    .emoji-top { font-size: 46px; }
  }
</style>
</head>
<body>

  <div class="hearts" id="hearts"></div>
  <canvas id="confetti"></canvas>

  <main class="card">
    <span class="emoji-top">🎉</span>
    <h1>Дорогой папа!</h1>

    <p class="text">
      Я тебе желаю удачи, здоровья, добра и всего хорошего!
    </p>

    <div class="divider"></div>

    <p class="signature">С любовью и лучшими пожеланиями ❤️</p>

    <button id="btn">Нажми меня 🎊</button>
  </main>

<script>
  /* ---------- Конфетти ---------- */
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function burst(x, y) {
    for (let i = 0; i < 90; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 14,
        vy: Math.random() * -13 - 3,
        size: Math.random() * 9 + 4,
        color: `hsl(${Math.random() * 360}, 92%, 62%)`,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.35,
        life: 1
      });
    }
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.32;
      p.vx *= 0.99;
      p.rot += p.vr;
      p.life -= 0.008;

      if (p.life <= 0 || p.y > canvas.height + 60) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
      ctx.restore();
    }
    requestAnimationFrame(loop);
  }
  loop();

  /* ---------- Кнопка ---------- */
  document.getElementById('btn').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
  });

  /* ---------- Плавающие сердечки ---------- */
  const heartsBox = document.getElementById('hearts');
  const symbols = ['❤️', '💛', '💫', '✨', '🎈', '🌟'];

  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    const dur = 8 + Math.random() * 8;
    h.style.animationDuration = dur + 's';
    h.style.animationDelay = (Math.random() * 2) + 's';
    heartsBox.appendChild(h);
    setTimeout(() => h.remove(), (dur + 3) * 1000);
  }

  for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 500);
  setInterval(spawnHeart, 1200);

  /* ---------- Салют при загрузке ---------- */
  window.addEventListener('load', () => {
    setTimeout(() => burst(window.innerWidth / 2, window.innerHeight * 0.35), 600);
    setTimeout(() => burst(window.innerWidth * 0.25, window.innerHeight * 0.45), 1100);
    setTimeout(() => burst(window.innerWidth * 0.75, window.innerHeight * 0.45), 1500);
  });
</script>
</body>
</html
